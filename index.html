<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Dashboard</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="weather-bg" aria-hidden="true"></div>

	<!-- Header -->
	<header>
		<h1>Weather Dashboard</h1>
		<button type="button" id="theme-toggle">🌙 Dark mode</button>
	</header>

	<main>
		<!-- City search -->
		<form id="search-form">
			<label for="city-input">City name</label>
			<input type="text" id="city-input" placeholder="Enter a city name">
			<button type="submit" id="search-btn">Search</button>
		</form>

		<!-- Recent searches -->
		<div id="recent-searches" class="chips"></div>

		<!-- Status messages -->
		<div id="status" aria-live="polite"></div>

		<!-- Current weather -->
		<section id="current-weather" aria-labelledby="current-heading">
			<h2 id="current-heading">Current weather</h2>
			<div id="current-card"></div>
		</section>

		<!-- Five-day forecast -->
		<section id="forecast" aria-labelledby="forecast-heading">
			<h2 id="forecast-heading">5-day forecast</h2>
			<div id="forecast-container" class="forecast-grid"></div>
		</section>
	</main>

	<!-- Footer -->
	<footer>Weather data by Open-Meteo</footer>

	<script src="script.js" defer></script>
</body>
</html>
